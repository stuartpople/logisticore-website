# Static HTML — no build step
[build]
  publish = "."
  command = "echo static"

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 301

[[redirects]]
  from = "/privacy/"
  to = "/privacy.html"
  status = 301

[[redirects]]
  from = "/rates"
  to = "https://app.logisticoreapp.com/rates/tool/"
  status = 302

[[redirects]]
  from = "/rates/*"
  to = "https://app.logisticoreapp.com/rates/tool/"
  status = 302
